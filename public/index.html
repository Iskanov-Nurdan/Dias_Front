<!DOCTYPE html>
<html lang="ru">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dias_theme');
          var mode = t === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.style.colorScheme = mode === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#C53030" />
    <meta name="description" content="DIAS LINE — система управления производством" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- favicon.ico и *-icon-* — квадратная эмблема DL (без текстовой плашки
         «DIAS LINE», на 16-32px она нечитаема), обрезана из dias-line-logo.png.
         Сам dias-line-logo.png (полный логотип с текстом) не трогаем — им
         пользуются сайдбар и страница входа (MainLayout.js/LoginPage.js). -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/dias-line-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/dias-line-icon-512.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>DIAS LINE</title>
  </head>
  <body>
    <noscript>Для работы приложения необходимо включить JavaScript. Включите его в настройках браузера и обновите страницу.</noscript>
    <div id="root"></div>
  </body>
</html>
