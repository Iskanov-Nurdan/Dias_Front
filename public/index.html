<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1e3a5f" />

    <!--
      Этот же index.html отдаётся и на публичную страницу клуба (корень домена, /taplink),
      и на весь внутренний CRM (/clients, /reports и т.д.) — React-роутер на клиенте решает,
      что показать, а сервер всегда отвечает одним и тем же файлом.
      Поэтому теги ниже описывают КЛУБ, а не CRM: именно эту версию видит поисковый бот
      и превью в мессенджерах/соцсетях (они не выполняют JS, значит не увидят изменения,
      которые TaplinkPage вносит через document.title уже в браузере после загрузки).
      CRM-страницы не индексируются (см. robots.txt) и на подпись вкладки браузера
      это не влияет — сотрудникам достаточно логотипа во вкладке.
    -->
    <!--
      Название клуба в описании стоит в обоих написаниях намеренно: по «рахман ата»
      сайт находился, а по «rahman ata» — нет, потому что латиницы в видимом тексте
      не было нигде. Meta keywords на это не влияет вовсе (Google не учитывает этот
      тег с 2009 года) — работает описание, заголовок и текст на самой странице.
    -->
    <meta name="description" content="Рахман Ата (Rahman Ata) — спортивный клуб в Оше: ММА, бокс, дзюдо, вольная борьба, грэпплинг, бразильское джиу-джитсу, кроссфит. Профессиональные тренеры, группы для всех возрастов. Запись на пробную тренировку." />
    <meta name="keywords" content="Рахман Ата, Rahman Ata, rahmanata, Rahman Ata Sport Club, спортивный клуб Ош, единоборства, ММА, бокс, дзюдо, вольная борьба, грэпплинг, бразильское джиу-джитсу, кроссфит" />
    <meta name="robots" content="index, follow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Canonical: сайт открывается и на "/", и на "/taplink" — один и тот же контент,
         канонический адрес указывает поисковику, какой URL считать основным. -->
    <link rel="canonical" href="https://rahmanata.kg/" />

    <!-- Open Graph / превью в WhatsApp, Telegram, Instagram, Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Рахман Ата" />
    <meta property="og:title" content="Рахман Ата — Спорт Клуб | Rahman Ata, Ош" />
    <meta property="og:description" content="ММА, бокс, дзюдо, вольная борьба, грэпплинг, БЖЖ, кроссфит. Профессиональные тренеры, группы для всех возрастов." />
    <meta property="og:image" content="https://rahmanata.kg/rahman.png" />
    <meta property="og:url" content="https://rahmanata.kg/" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter/X card — тот же принцип, что и Open Graph выше -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Рахман Ата — Спорт Клуб | Rahman Ata, Ош" />
    <meta name="twitter:description" content="ММА, бокс, дзюдо, вольная борьба, грэпплинг, БЖЖ, кроссфит." />
    <meta name="twitter:image" content="https://rahmanata.kg/rahman.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <!--
      Иконка сайта: крупная белая «R» из фирменного логотипа на сплошном
      фирменном красном.

      Почему именно так, а не обрезок логотипа: раньше иконкой было красное
      кольцо с белой «R» внутри и прозрачным фоном. На тёмной вкладке браузера
      она читалась, а в выдаче Google, где иконку рисуют на светлом кружке,
      белая буква на белом просто исчезала — оставался «красный бублик».
      Собственный непрозрачный фон делает иконку одинаково читаемой на любой
      подложке, а кольцо превратилось в сам фон — так «R» занимает всю иконку
      и различима даже в 16 пикселях. Поля 15% оставлены под круглую обрезку,
      которую Google применяет к иконкам в выдаче.
    -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Рахман Ата — Спорт Клуб | Rahman Ata, Ош</title>

    <!--
      Structured data: помогает Google понять, что это спортивный клуб, и
      собрать карточку организации — а в карточке бренд находится по любому
      написанию названия, включая латиницу и опечатки.

      Здесь только то, что не меняется (название, написания, адрес страницы,
      виды спорта). Телефон, адрес и соцсети редактируются в админке Taplink,
      поэтому дублировать их сюда нельзя — разъедутся. Их дописывает в этот же
      блок TaplinkPage из живого конфига (см. useEffect с ld+json там).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsActivityLocation",
        "@id": "https://rahmanata.kg/#organization",
        "name": "Рахман Ата",
        "alternateName": [
          "Rahman Ata",
          "Rahman Ata Sport Club",
          "Рахман Ата Спорт Клуб",
          "rahmanata"
        ],
        "url": "https://rahmanata.kg/",
        "image": "https://rahmanata.kg/rahman.png",
        "logo": "https://rahmanata.kg/icon-512.png",
        "sport": ["ММА", "Бокс", "Дзюдо", "Вольная борьба", "Грэпплинг", "Бразильское джиу-джитсу", "Кроссфит"]
      }
    </script>
  </head>
  <body>
    <noscript>Для работы приложения необходимо включить JavaScript. Включите его в настройках браузера и обновите страницу.</noscript>
    <div id="root"></div>
  </body>
</html>
